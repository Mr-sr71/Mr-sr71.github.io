<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Redirecting...</title>
    <script>
        // Get the requested URL path (e.g., "/scripts")
        var currentPath = window.location.pathname;
        
        // Remove the starting slash, capitalize the first letter, and add the slash back
        // Example: "/scripts" becomes "/Scripts"
        var cleanPath = currentPath.substring(1);
        var fixedPath = "/" + cleanPath.charAt(0).toUpperCase() + cleanPath.slice(1);

        // If the fixed version matches your actual capitalized page, redirect there
        if (fixedPath !== currentPath) {
            window.location.replace(fixedPath);
        } else {
            // Real 404 error fallback
            document.write('<body style="background:#0d0d0d;color:#ff3333;font-family:monospace;text-align:center;padding:50px;"><h1>404 - PAGE NOT FOUND</h1><p>Check your link and try again.</p></body>');
        }
    </script>
</head>
<body>
</body>
</html>
