<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!-- 1. The line below handles the instant browser redirect (0 seconds) -->
    <meta http-equiv="refresh" content="0; url=https:mr-sr71.github.io/Secret/">
    <title>Redirecting...</title>
    
    <!-- 2. JavaScript fallback script in case the meta refresh is blocked -->
    <script>
        window.location.replace("https://mr-sr71.github.io/Secret/");
    </script>
</head>
<body style="background-color: #0d0d0d; color: #ff3333; font-family: monospace; text-align: center; padding-top: 20%;">
    <p>Redirecting to your destination...</p>
    <!-- 3. Manual link just in case anything fails -->
    <p><a href="https://mr-sr71.github.io/Secret/" style="color: #ffffff;">Click here if you are not redirected automatically</a></p>
</body>
</html>
