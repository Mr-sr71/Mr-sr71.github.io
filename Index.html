<!DOCTYPE html>
<html>
<head>
  <link rel="stylesheet" href="styles.css">
<title>My Site</title>
</head>
<body id="background">
  
<script>
function dark() {
  document.getElementById("background").style.backgroundColor = "black";
}
</script>

<script>
function light() {
  document.getElementById("background").style.backgroundColor = "white";
}
</script>

<button type="button" onclick="light()">Light mode</button>
<button type="button" onclick="dark()">Dark mode</button>

<h1>Welcome to my site!</h1>

</body>
</html>
